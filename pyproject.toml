[project]
name = "affecte"
version = "1.0.0"
requires-python = ">=3.12"
authors = [
    { name = "Szymon Auguscik" }
]
readme = "README.md"
dependencies = [
    "bidict>=0.22.1",
    "biosppy>=1.0.0",
    "certifi>=2024.7.4",
    "cffi>=1.17.0",
    "charset-normalizer>=3.0.1",
    "cmake>=3.26.3",
    "colorama>=0.4.6",
    "colorlog>=6.7.0",
    "contourpy>=1.3.1",
    "coverage>=7.6.1",
    "cycler>=0.11.0",
    "easydev>=0.12.1",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "fsspec>=2024.9.0",
    "future>=0.18.3",
    "h5py>=3.12.1",
    "idna>=3.15",
    "jinja2>=3.1.6",
    "joblib>=1.2.0",
    "kiwisolver>=1.4.7",
    "lit>=16.0.2",
    "markupsafe>=2.1.2",
    "matplotlib>=3.9.3",
    "mpmath>=1.3.0",
    "networkx>=3.1",
    "nolds>=0.5.2",
    "numpy>=1.26.0",
    "opencv-python>=4.8.1.78",
    "packaging>=23.0",
    "pandas>=2.2.3",
    "pexpect>=4.8.0",
    "pillow>=12.3.0",
    "ptyprocess>=0.7.0",
    "pycparser>=2.21",
    "pyhrv>=0.4.1",
    "pyparsing>=3.0.9",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.5",
    "requests>=2.33.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "shortuuid>=1.0.11",
    "six>=1.16.0",
    "soundfile>=0.11.0",
    "spectrum>=0.8.1",
    "sympy>=1.13.3",
    "threadpoolctl>=3.1.0",
    "tk>=0.1.0",
    "torch>=2.13.0",
    "triton>=3.3.1",
    "typing-extensions>=4.12.2",
    "tzdata>=2024.2",
    "urllib3>=2.8.0",
    "wfdb>=4.1.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
